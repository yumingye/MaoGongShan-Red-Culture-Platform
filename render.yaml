services:
  - type: web
    name: maogongshan-red-culture-api-yumingye
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SERVICE_NAME
        value: maogongshan-api
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: /tmp/maogongshan.db
      - key: READ_ONLY_MODE
        value: "true"
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
